; FF8 Remastered: Demaster patch config file
; 1.3.7  - Core DEMASTER by MakiPL
; 1.4.1a - New World Vehicles and Field Modules by MCINDUS
; 1.5.0a - New PBR Module for Field Backgrounds by MCINDUS
; 1.5.1a - PBR for Field Characters and Models (room light, real shadows, reflections, per-pixel depth) by MCINDUS
; 1.5.2a - Quality levels for PBR fields (FIELD_PBR_QUALITY), the GL state remembered (FIELD_GL_TRACK) by MCINDUS
; This is a continuation of DEMASTER by MaKiPL, vibe-coded by MCINDUS.
;
; Modules added: 
; World Vehicles, Effects, Oceans, and previously missing World Textures
; Field Background 'unswizzled' Texture Loader
; Full PBR Module, introducing Normal Mapping, Ambient Occlusion, Roughness, Metalness, and HeightMaps to FF8
; Integrated Depth Maps for lighting, shadows, and PBR precision.
; PBR Field Characters and Models: lit by the room, character shadows and reflections, normal/ORME maps, DDS mipmaps
;
; [MAIN DEMASTER OPTIONS]
DIRECT_IO=1
;[CORE]- loads files from unpacked archives
LOG=1
;Outputs logs to demaster.txt
LOG_SEVERITY=0
;0=NONE; 1=FATAL; 2=ERROR; 3=WARNING; 4=INFO; 5=DEBUG; 6=VERBOSE
SKIP_SPLASH=0
;Skips the splash screen and loads directly to game menu
;
; [ADVANCED OPTIONS-PRO'S ONLY]
TEXTURE_PATCH=1
;global switch for tex patch
LINEAR_PATCH=1
;Disables linear filtering and brings back point clamp as in PlayStation
LINEAR_PATCH_MIN_FILTER=0
;1 = also use point filtering when textures are drawn smaller than their size (LINEAR_PATCH never managed to set this; changes how HD textures look at a distance)
KEEP_HD_RESOLUTION=1
;Keeps replaced world and battle textures at full resolution instead of letting the game re-render them at 2x the PlayStation size
OPENGL_HOOK=0
;Enables all sorts of functions for OpenGl
FORCE_NEAREST_FILTERING=0
;Forces nearest filtering for -everything-. [WARNING - LOOKS BAD]
;
; [WIDESCREEN OPTIONS]
FILL_ASPECT_RATIO=0
;Stretch the 4:3 to 16:9 aspect ratio
;
;WIDESCREEN_EXPERIMENTAL=0
;[WIP] Maki's widescreen test from 9 Feb 2026: forces the game's draw area to x=107 w=426 h=480 every time the game sets it
;and turns off scissor clipping. Builds of that commit always had it on. With it on, IMGUI_DEBUG=1 shows sliders for it.
;
;
; [BATTLE MODULE]
BATTLE_CHARACTER=1
;Disables battle characters texture resolution limit 
BATTLE_HOOK_MONSTER_FIELDS=1
;Enables support for new/custom texture of battle stages and monsters and fields
BATTLE_STAGE_ANIMATION_DELAY=100
;In milliseconds, if this number is too low it may skip frames.
BATTLE_STAGE_FORCE_RELOAD=0
;Causes textures to reload when requested from game. This might need to start a new battle.
;
; [WORLD MODULE]
UV_PATCH=1
;Fixes worldmap UV issues significantly improving graphic
WORLD_TEXTURES=1
;[UNSTABLE] Enables support for loading custom worldmap textures
WORLD_VEHICLES=1
;[EXPERIMENTAL] World textures by name, wherever the game puts them: vehicles, characters, water, effects, the select map.
;One file per texture: textures\world\dat\wmset\section38\texture11.png (all palettes; optional _p<palette> and _f<frame>
;variants), textures\world\esk\chara_one\model1.png (one strip per model, textures left to right). tools/world_vehicle_dump.py
REMASTER_WMSET014=field.fs\field_hd_new\wmset_vehicle_0
;Remastered loads its remodelled vehicle texture as textures\field.fs\field_hd_new\wmset_014_0.png. With this set it loads
;DEMASTER_EXP\textures\<name>.png instead (only if that file exists). Empty keeps the original name.
WORLD_DEBUG=0
;1 = logs each world texture page once (type, tpage, palette, size) and what WORLD_VEHICLES finds on it
;2 = also saves each page once as DEMASTER_EXP\world_dump\typeT_tpageNN_paletteNN.png (to see what is where)
;
; [FIELD MODULE]
FIELD_BACKGROUND=1
;Enables support for loading custom field backgrounds
FIELD_ENTITY=1
;Disables texture resolution limit for field models
FIELD_LAYERS=1
;[EXPERIMENTAL] Field backgrounds straight from Field-Map-Editor's deswizzled layers (one image per PupuID), no swizzling:
;textures\field_bg\<xx>\<field>\<field>_<pupu>.png|dds, or <field>_<language>_<pupu> for a field with a .map per language.
;PNG and DDS both work. When a layer has both, the newer file is used, so you can edit the PNG, then make the DDS when done.
;BC7 .dds at 4x or 8x are copied block by block into the game's pages on the GPU; PNG (and anything else) is put together on the CPU.
;A field that has layer images is not loaded from its swizzled pages. Tiles without an image use the swizzled page if there is
;one, else the game's own. Needs BATTLE_HOOK_MONSTER_FIELDS=1.
FIELD_LAYERS_LIVE=1
;Layer images you change while the game runs show up within a second (the field's pages are rebuilt). 0 = read once per field.
FIELD_LAYERS_UNSHARE=1
;Tiles that share one cell of a texture page but have their own image get a free cell (the .map is changed in memory only)
FIELD_SMOOTH=1
;Smooth filtering inside each tile of a page from layers, without seams (needs DEMASTER_EXP\shaders\main.frag from this release)
FIELD_BG_RESOLUTION=4
;Size of the buffer field backgrounds are drawn into, which is also where characters get cut by the background:
;4 = 1280x960 (DEMASTER's), 6 = 1920x1440, 8 = 2560x1920. Any other value is taken as 4.
FIELD_DEBUG=1
;1 = log every field: tiles, layer images found and missing, pages; 2 = also save every page as DEMASTER_EXP\field_dump\*.png
FIELD_PBR=1
;[EXPERIMENTAL] Light field backgrounds in the shader. Only layers with PBR files are affected (a layer with its own
;<field>_<pupu>_A and an _LF), so fields without them look exactly as before. fieldprep.exe makes the files.
;Needs FIELD_LAYERS=1 and every file in DEMASTER_EXP\shaders\ from this release (without them, PBR layers fall back to their paintings).
FIELD_PBR_VIEW=0
;What PBR layers show, for checking your maps in the game: 0 = lit (normal), 1 = albedo, 2 = lightmap, 3 = normals,
;4 = depth, 5 = AO, 6 = roughness, 7 = metallic, 8 = flicker mask, 9 = only the added light, 10 = with every light at rest,
;11 = the room's light on the characters (grey), 12 = shadows, 13 = reflections, 14 = how far each pixel is behind its
;tile's nearest part (where a character can be seen in between), 15 = the characters' normals, 16 = the glows as they'll
;show at night (the emissive map in _ORME, with the lights file's [emissive] hue, tint and strength), 17 = the emissive map
FIELD_PBR_DEPTH=1
;Background tiles keep the game's depth; where a character stands between a tile and what a pixel of it really shows (the
;floor inside a pillar's tile), that pixel lets the character through. 0 = per tile only, exactly like the game
FIELD_PBR_QUALITY=medium
;How much of the graphics card PBR fields use: low (integrated graphics: 2 sharp shadow maps, no reflections, no wall checks),
;medium (GTX 1060 class: 4 soft shadow maps, reflections, short wall checks), high (8 shadow maps, longer wall checks)
FIELD_GL_TRACK=1
;DEMASTER remembers the OpenGL state as the game sets it, instead of asking the driver around every draw (asking makes the
;game wait, a lot with NVIDIA's "Threaded optimization"). It checks itself now and then and stops on its own if it ever
;disagrees with the driver (the log says so). 0 = always ask the driver (v15)
FIELD_PBR_SHADOWS=1
;Character shadows from the field's lights, contact darkening, room shadows for added lights. 0 = the game's round shadows
FIELD_PBR_REFLECTIONS=1
;Characters and 3D objects reflected in metal and glossy surfaces
FIELD_PBR_CHARACTERS=1
;Characters lit by the room (its light in 3D, added lights, flicker). 0 = the game's flat lighting
FIELD_AVATARS=0
;Face captures of each character for portraits. Ctrl+F10 saves them to DEMASTER_EXP\avatars\
FIELD_FRAME_LOG=1
;Ctrl+F11 writes down everything the game draws in the next frame (every draw, its buffer, shader, state and vertices),
;plus the frame's buffers (colour and depth) and textures, into DEMASTER_EXP\frame_log\<field>_<date>_<time>\, and how
;long DEMASTER's steps took (CPU: average of the frames before; GPU: in that frame). Costs nothing until you press it. 0 = off

; [THE LOOK] how far the maps change the painting itself. Needs FIELD_PBR=1 and prepared fields
FIELD_PBR_LOOK=0
;The master dial. 0 = off: a PBR field at rest is its painting, exactly (the maps only shape light that is added: lights
;with intensity, flicker, shadows, reflections, the night). 1 = the look as the three dials below set it; up to 2 = twice
;that. Each dial's strength is its own value x this x the field's "look" in its _pbr.txt (1 unless you change it; a
;field's _pbr.txt can also set its own look_relight, look_highlights and look_ao). _pbr.txt is read again within a second
;of saving it, so a field can be tuned while you stand in it; this file is read when the game starts
FIELD_PBR_RELIGHT=0.5
;Relight: the painted light follows the normal map. Surfaces turned towards the lamps that are on get brighter, surfaces
;turned away get darker, so the relief in the normal map shows in the painting itself. The field as a whole keeps its
;brightness. Only lamps that are in the painting count (baked = 1 in _lights.txt), and the sun. 0 = off
FIELD_PBR_HIGHLIGHTS=0.5
;Highlights: the painted lamps make highlights on glossy and metal surfaces (from the roughness and metallic maps), without
;adding their diffuse light a second time. 0 = off (only lights with intensity make highlights)
FIELD_PBR_AO=0.5
;The AO map darkens the painting too: creases and corners get deeper. 0 = AO only dims added light
;Cost: next to nothing at any FIELD_PBR_QUALITY (a few multiplications per pixel and light; no extra texture reads).

; [MOVING LIGHTS] lights that aren't at a fixed place in a field's _lights.txt
FIELD_MOVING_LIGHTS=1
;The module's switch. 0 = no sun, no party light
FIELD_SUN=1.0
;The sun's strength (0 = off). On fields open to the sky (sky = 1 in the field's _pbr.txt, or [sun] on = 1 in its
;_lights.txt) a sun crosses the sky with the day/night clock: it adds light to what faces it, the characters cast shadows
;from it, and with FIELD_PBR_RELIGHT the painted light follows it from morning to evening. At night a faint moon does the
;same. Its path, strength and the moon are per field: [sun] in _lights.txt (azimuth, height, intensity, shade, moon, fixed)
FIELD_PARTY_LIGHT=1
;A light the party leader carries: 0 = off, 1 = at night (it comes on as the room goes dark), 2 = always.
;Per field: [party] in _lights.txt (on, color, intensity, range, height, follow). The log says which script entity
;DEMASTER took for the leader; follow = <entity> picks another
FIELD_PARTY_LIGHT_STRENGTH=1.0
;Times every field's [party] intensity
;Cost: each is one more light. With FIELD_PBR_QUALITY=low that is small; with medium or high each also gets the wall
;checks every added light gets, the sun over the whole picture (about a third more shader work on a sunlit field).

; [MOVEMENT AND MOTION]
ANALOG_MOVEMENT=1
;Fields: the pad's left stick walks at any angle instead of the d-pad's eight directions (the game's own analogue walking
;from the PlayStation, which Remastered never switches on). XInput pads (Xbox pads, and anything Steam Input presents as
;one). 0 = off
ANALOG_DEADZONE=0.25
;How far the stick has to move before it counts, as a share of its full throw (0.05 to 0.9). Raise it if the character
;creeps with the stick at rest
ANALOG_WORLD_MAP=1
;The world map: the left stick moves at any angle too (needs ANALOG_MOVEMENT=1 and a pad). 0 = the world map as it was
MOVE_TURN_SPEED=720
;Fields: when you change direction, the character's walking direction swings towards the new one instead of jumping to
;it, as on the PlayStation. Degrees a second: 720 turns a quarter turn in an eighth of a second; lower is a wider arc.
;For the d-pad and the arrow keys (which then walk through the game's analogue code, as a stick pushed all the way) and
;for the left stick. 0 = off: the d-pad and the keys walk exactly as the game does it
FIELD_SMOOTH_SCROLL=1
;Fields drawn from layer images (FIELD_LAYERS): every background layer is drawn at the unrounded place of its scroll
;instead of in whole-pixel steps, and the characters move with the main layer. Takes the shimmer out of layers that scroll
;at different speeds (parallax) and the stepping out of slow scrolls. Never more than 3/4 of a PlayStation pixel from
;where the game draws things, and exactly the game's picture when the screen stands still. Cost: next to nothing. 0 = off
FIELD_INTERPOLATION=0
;Fields drawn from layer images: an in-between picture is shown before each of the game's frames (60 pictures a second from
;the game's 30): layers halfway along their scroll, characters halfway between their two poses. The game itself keeps
;running at its own speed. 0 = off (the default since v15.12: in the game it slowed fields down; it is being rebuilt).
;Cost: everything in a field is drawn twice, so about double the graphics card's work there, and a second copy of the
;game's framebuffers in video memory (roughly 150-200 MB at FIELD_BG_RESOLUTION 4, four times that at 8). Adds half a
;frame (1/60 s) of delay between pad and picture. If the game gets slower with it than without, DEMASTER turns it off for
;that field and says so in the log (after three such fields, for the session). Needs FIELD_GL_TRACK=1.
;Not in-between: the character shadows and reflections of FIELD_PBR (they are the frame's own in both pictures), the
;game's round shadows, and effects that are neither tiles nor characters.

; [BATTLES AND THE WORLD MAP]
SCENE_LIGHT=1
;Day and night in battles and on the world map (needs DAY_NIGHT=1 and this release's DEMASTER_EXP\shaders\main.frag): the
;picture darkens and takes the night's colour. The settings, and rules for single battle stages or parts of the story (the
;Lunar Cry), are in DEMASTER_EXP\scene_light.txt, written with the defaults the first time (delete it to get this
;release's, which explains the new settings). Battle stages are lit from their own space: the sun and the moon cross them by
;the clock, and a stage can have four lights of its own (scene_light.txt). A stage page can have, next to its picture, a
;normal map (a0stgNNN_P_N), an ORM map (a0stgNNN_P_ORM) and a picture of its glows (a0stgNNN_P_EC). 0 = off
SCENE_DEBUG=0
;1 = the log says what SCENE_LIGHT decides when a battle or the world map starts (the stage, the story's counter, whether
;the night comes there), and the projection's numbers at a stage draw (for lighting normal maps in a later build)

; [DAY AND NIGHT]
DAY_NIGHT=1
;One day/night clock for the whole game. PBR fields follow it: day and night lights cross-fade, the painting dims to the
;lights file's [night] level and tint away from the lamps that are on at night, and the glows come on. A field with
;time = day or night in its _pbr.txt is always that, and the clock waits while you're there. The time is kept in
;DEMASTER_EXP\daynight.txt. Battles and the world map have no PBR yet: they only move the clock. 0 = always day (as painted)
DAY_NIGHT_DAY=480
;Seconds of day in fields, on the world map and in menus (8 minutes), from the middle of one fade to the middle of the next
DAY_NIGHT_NIGHT=240
;Seconds of night (4 minutes)
DAY_NIGHT_FADE=40
;Seconds each fade between them takes
DAY_NIGHT_BATTLE=3
;Battles run the clock this many times slower (24 + 12 minutes, 120 s fades); the field goes on from where the battle left it
DAY_NIGHT_KEYS=1
;For testing: Ctrl+F7 swaps day and night, Ctrl+F8 pauses the clock, Ctrl+F9 runs it at 1x, 10x, 60x, Ctrl+F6 jumps to 5
;seconds before the next fade. The log says what each key did and the time it is
DAY_NIGHT_BAR=1
;While the clock is paused or sped up (and for a few seconds after a key), a thin bar across the top of the screen shows the
;cycle (amber day, blue night, starting at dawn on the left) and where the clock is: white at 1x, yellow 10x, orange 60x,
;red paused, grey where the field holds the clock

; [HASHING OPTIONS]
; NOTE: There is consistent VRAM bleed from other modules/textures in the 'empty' VRAM areas, which creates an impossible
; amount of textures that need to be hashed for a single replacement. These bleeding VRAM textures should be avoided.
HASH_ENABLED=1
;Enables hash feature
HASH_OUTPUT=0
;Outputs hashed textures
HASH_OUTPUT_EXT=0
;Keep on 0 for now
HASH_LOAD_HD=1
;Enable loading of HD textures from hash
HASH_LOAD_HD_EXT=1
;Keep on 1 for DDS
;
;
; [EXTRA MODDER + DEBUG OPTIONS]
DEVELOPER=0
;Enables powerful developer window for debugging, research and modding [BETA]
MORE_DEBUG_OUTPUT_PATCH=0
;outputs rich engine data to debug console - now stable!
IMGUI_DEBUG=0
;Imgui debug mode
DEBUG_GLTEXIMAGE2D=0
;Enables debug output for glTexImage2D
;
;
AUTO_UNPACK=0
;Enables ZZZ unpacking when starting the game.
